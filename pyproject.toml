[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-assistant"
version = "0.1.0"
description = "Assistente pessoal local, com ferramentas autorizadas e workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "anyio>=4,<5", "sqlalchemy[asyncio]>=2.0.38,<3",
  "asyncpg>=0.30,<1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "jinja2>=3.1.5,<4",
  "argon2-cffi>=23.1,<26", "cryptography>=44,<48", "psutil>=6,<8",
  "pillow>=11,<13", "mss>=10,<11", "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
desktop = ["pywinauto>=0.6.9,<0.7; sys_platform == 'win32'", "pyautogui>=0.9.54,<1; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not desktop'"
markers = ["unit: sem banco nem GUI, dependências externas simuladas", "integration: usa PostgreSQL real em banco exclusivo de testes", "desktop: GUI Windows real, opt-in e seleção explícita"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
